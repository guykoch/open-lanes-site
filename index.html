<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amazon Open Lanes</title>
<style>
  :root{ --navy:#232F3E; --orange:#FF9900; --bg:#F5F6F8; --line:#DDE1E6; --muted:#5F6B7A; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column}
  nav{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px, env(safe-area-inset-top));background:var(--navy)}
  .brand{color:#fff;font-weight:700;font-size:15px;margin-right:auto;white-space:nowrap}
  .brand b{color:var(--orange)}
  .tab{border:0;border-radius:8px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer;background:transparent;color:#C9D1DA}
  .tab[aria-selected="true"]{background:var(--orange);color:var(--navy)}
  main{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
  iframe.on{display:block}
  .err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);padding:16px;text-align:center}
  @media (max-width:520px){ .brand{display:none} .tab{flex:1} }
</style>
</head>
<body>
<div class="app">
  <nav role="tablist">
    <span class="brand">Amazon <b>Open Lanes</b></span>
    <button class="tab" role="tab" data-tab="simulator">Route Simulator</button>
    <button class="tab" role="tab" data-tab="qa">Q&amp;A Practice</button>
  </nav>
  <main>
    <iframe id="f-simulator" title="Route Simulator" data-src="simulator.html"></iframe>
    <iframe id="f-qa" title="Q&amp;A Practice" data-src="qa.html"></iframe>
  </main>
</div>
<script>
  // Each tab is its own page, loaded the first time it's opened.
  function show(name){
    if (!document.getElementById('f-'+name)) name = 'simulator';
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
    document.querySelectorAll('iframe').forEach(f => {
      const on = f.id === 'f-'+name;
      if (on && !f.src) f.src = f.dataset.src;
      f.classList.toggle('on', on);
      if (on) f.addEventListener('load', () => { try { f.contentWindow.focus(); } catch(e){} }, { once:true });
    });
    if (location.hash !== '#'+name) history.replaceState(null, '', '#'+name);
  }
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => show(b.dataset.tab));
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1) || 'simulator');
</script>
</body>
</html>
